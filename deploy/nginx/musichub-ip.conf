server {
    listen 80;
    listen [::]:80;
    server_name 81.68.72.245;

    # Keep this private preview restricted to localhost and Tian's current public IP.
    allow 127.0.0.1;
    allow ::1;
    allow 223.85.187.117;
    deny all;

    access_log /var/log/nginx/musichub-access.log;
    error_log /var/log/nginx/musichub-error.log warn;

    location /hls/ {
        alias /run/yorushika-radio/hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            application/json json;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://unix:/var/www/My_Homepage/musichub.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The IP-only endpoint is HTTP, so replace the app's HTTPS-only CSP here.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self' https: data: blob:; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; connect-src 'self' https:; media-src 'self' blob:; frame-ancestors 'self'" always;
    }
}
