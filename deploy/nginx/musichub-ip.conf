server {
    listen 80;
    listen [::]:80;
    server_name 81.68.72.245;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    # Keep this private preview restricted to localhost and Tian's current public IP.
    allow 127.0.0.1;
    allow ::1;
    allow 223.85.187.117;
    allow 223.85.187.13;
    allow 223.85.185.221;
    deny all;

    access_log /var/log/nginx/musichub-access.log;
    error_log /var/log/nginx/musichub-error.log warn;

    location /static/ {
        root /var/www/My_Homepage;
        access_log off;
        expires 1d;
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /hls/ {
        alias /run/yorushika-radio/hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            application/json json;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://unix:/run/musichub/musichub.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "private, no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
