server {
    listen 80;
    listen [::]:80;
    server_name radio.yoruming.cn;
    server_tokens off;

    access_log /var/log/nginx/musichub-radio-access.log;
    error_log /var/log/nginx/musichub-radio-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://radio.yoruming.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radio.yoruming.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/radio.yoruming.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.yoruming.cn/privkey.pem;

    auth_basic "Yorushika Radio";
    auth_basic_user_file /etc/nginx/.htpasswd-radio;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    access_log /var/log/nginx/musichub-radio-access.log;
    error_log /var/log/nginx/musichub-radio-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        root /var/www/My_Homepage;
        access_log off;
        expires 1d;
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location /hls/ {
        alias /run/yorushika-radio/hls/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            application/json json;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://unix:/run/musichub/musichub.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "private, no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
