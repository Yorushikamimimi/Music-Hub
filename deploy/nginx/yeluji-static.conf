# 夜鹿集静态版（scripts/export_static.py 的产物），替换 musichub-radio.conf。
# 文件放在 /srv/sites/yeluji-static/current（指向某次发布目录的软链接）。
# 不要密码、不连数据库或应用进程；仍禁止搜索引擎收录。

server {
    listen 80;
    listen [::]:80;
    server_name radio.yoruming.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://radio.yoruming.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radio.yoruming.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/radio.yoruming.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.yoruming.cn/privkey.pem;

    root /srv/sites/yeluji-static/current;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    access_log /var/log/nginx/yeluji-static-access.log;
    error_log /var/log/nginx/yeluji-static-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Only GET/HEAD: nothing here accepts input.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/index.html =404;
    }
}
